<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" shape-rendering="crispEdges" style="color: #C15C3D;">
  <!-- CLAY Pixel Terminal Icon '>_' for VS Code Activity Bar -->
  <g fill="currentColor">
    <!-- Terminal Chevron '>' -->
    <rect x="4" y="5" width="2" height="2"/>
    <rect x="6" y="7" width="2" height="2"/>
    <rect x="8" y="9" width="2" height="2"/>
    <rect x="10" y="11" width="2" height="2"/>
    <rect x="8" y="13" width="2" height="2"/>
    <rect x="6" y="15" width="2" height="2"/>
    <rect x="4" y="17" width="2" height="2"/>

    <!-- Terminal Underscore Cursor '_' -->
    <rect x="14" y="17" width="6" height="2"/>
  </g>
</svg>
